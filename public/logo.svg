<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D97B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA821C" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A44C4" />
      <stop offset="100%" stop-color="#2E2A7B" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Crest -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield -->
    <path d="M 40 0 L 72 15 Q 72 50 40 80 Q 8 50 8 15 Z" fill="url(#blue-grad)" stroke="url(#gold-grad)" stroke-width="3" />
    <!-- Growing Sprout / Plant inside Shield -->
    <path d="M 40 60 L 40 25 M 40 40 Q 30 35 22 45 M 40 32 Q 50 27 58 37" fill="none" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Core Golden Coin Symbol -->
    <circle cx="40" cy="22" r="6" fill="url(#gold-grad)" />
  </g>
  
  <!-- Corporate Text -->
  <g transform="translate(105, 45)">
    <text font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="32" fill="#2E2A7B" letter-spacing="1">KKNL</text>
    <text font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="13" fill="#D4AF37" letter-spacing="3.5" y="20">KUSUMBHA KALYAN NIDHI LTD.</text>
    <text font-family="'Inter', sans-serif" font-weight="500" font-size="8.5" fill="#6B7280" letter-spacing="1.5" y="32">Adhering to MCA Nidhi Rules | Gov. of India Registered</text>
  </g>
</svg>
